<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780"><rect width="1120" height="780" fill="#101722"/><g font-family="sans-serif" fill="#e6edf6"><rect x="20" y="20" width="170" height="740" rx="12" fill="#192435"/><text x="40" y="60" font-size="22">Observatory</text><text x="40" y="110">全局概览</text><text x="40" y="150">VPS 管理</text><text x="40" y="190">告警 / 网络探测</text><text x="40" y="230">接入 / 系统设置</text><text x="220" y="55" font-size="24">节点 · 系统诊断</text><text x="220" y="95">运行监控 | 网络质量 | 系统诊断 | 容器与进程 | 资产</text><rect x="220" y="120" width="870" height="70" rx="10" fill="#20344b"/><text x="240" y="150">能力 / 配置版本 / 每流积压、最早时间 / 上次 ACK</text><text x="240" y="175">独立采样时间 · 不支持 / 不可读 / 陈旧</text><rect x="220" y="210" width="870" height="250" rx="10" fill="#192435"/><text x="240" y="245">对象选择　指标选择　1 小时 / 1 天 / 30 天 / 1 年 / 3 年</text><path d="M245 405 L390 350 L480 370 M540 360 L680 280 L810 320 L1050 270" stroke="#6aa9ff" fill="none" stroke-width="3"/><text x="240" y="440">空缺不补零；均值 / 最大值 / 有效样本 / 覆盖率</text><rect x="220" y="480" width="425" height="260" rx="10" fill="#192435"/><text x="240" y="520">配置（纵向表单）</text><text x="240" y="560">诊断开关 / 服务白名单</text><text x="240" y="600">进程白名单 / Docker 开关</text><text x="240" y="650">保存 → Agent 独立确认</text><rect x="665" y="480" width="425" height="260" rx="10" fill="#192435"/><text x="685" y="520">运行管理</text><text x="685" y="560">资产 / 到期通知</text><text x="685" y="600">批量令牌 / 撤销 / 安装说明</text><text x="685" y="640">定时报表 / CSV / 最近一期迟发</text><text x="685" y="700">手机：单列卡片 + 纵向表单</text></g></svg>
