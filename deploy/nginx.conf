# 宿主机 Nginx + 同机 Docker Compose 中心。
# 替换所有 monitor.example.com；证书就绪后再启用。
# 由 nginx.conf 的 http {} 加载，例如 /etc/nginx/conf.d/trafficmon.conf。
server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;

    # 保留此路径，供 acme.sh 自动续期使用。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://monitor.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name monitor.example.com;

    ssl_certificate /etc/nginx/ssl/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/monitor.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 与中心 Fastify 的 2 MiB 请求体限制一致，允许 Agent 分批补传。
    client_max_body_size 2m;

    location / {
        # 中心同时提供前端、API 与 SSE，保留完整请求路径。
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 每 5 秒推送；关闭缓冲、缓存和压缩以便及时送达。
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
