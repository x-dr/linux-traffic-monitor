# 首次申请证书时使用。把 monitor.example.com 替换为实际域名。
# 由 nginx.conf 的 http {} 加载，例如 /etc/nginx/conf.d/trafficmon.conf。
server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
