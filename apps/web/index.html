<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1220" />
    <script>
      // Restore the theme before styles or application modules can paint.
      (() => {
        let mode = 'dark';
        try {
          if (localStorage.getItem('observatory-theme') === 'light') mode = 'light';
        } catch {}
        document.documentElement.dataset.theme = mode;
        document.querySelector('meta[name="theme-color"]').content = mode === 'light' ? '#f3f6fa' : '#0c1220';
      })();
    </script>
    <style>
      :root { background: #0c1220; color-scheme: dark; }
      :root[data-theme='light'] { background: #f3f6fa; color-scheme: light; }
      body { margin: 0; }
    </style>
    <title>VPS Observatory · 服务器监控</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
